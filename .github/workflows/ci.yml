name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy app tests --show-error-codes
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No real env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "A real .env file is tracked by git." >&2
            exit 1
          fi
      - name: No server-only secrets referenced by the frontend
        run: |
          if grep -rInE 'service[_-]?role|jwt[_-]?secret|DATABASE_URL' frontend \
              --exclude-dir=node_modules --exclude-dir=.next --exclude=.env.example; then
            echo "The frontend must never reference server-only secrets." >&2
            exit 1
          fi

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build and start API
        run: docker compose up --build --detach --wait --wait-timeout 60
      - name: Health check
        run: curl --fail --silent http://127.0.0.1:8000/health
      - name: Stop
        if: always()
        run: docker compose down
