# Local development only. Milestone 1 runs just the API: no database,
# Redis, workers or AI services are added until something needs them.
# The frontend runs with `npm run dev` (see README.md).
name: ai-wellness-egypt

services:
  api:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      # Allowlist only what the API uses today. Secrets are passed through
      # here once a milestone actually needs them.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
