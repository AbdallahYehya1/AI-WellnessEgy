# Render Blueprint for the FastAPI backend (controlled testing).
#
# INERT until someone creates a Blueprint from it in the Render dashboard. It
# deploys nothing by itself. Secrets are `sync: false`: Render prompts for them
# at creation and they never live in this repository. Auto-deploy is off so
# every deploy is a deliberate action. Migrations are NOT run here: apply them
# with docs/SUPABASE_MIGRATION_RUNBOOK.md, under a separate approval.
services:
  - type: web
    name: ai-wellness-egypt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Paid instance: free instances sleep, and a cold start exceeds the
    # frontend's 5-second API timeout ("We can't load your account").
    plan: 0.5c-512mb
    # Choose the region closest to the Supabase project's region.
    region: frankfurt
    # Liveness only: stays 200 during a database outage (API calls then return
    # 503 and recover on their own), so Render doesn't restart-loop the service.
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # The image's uvicorn binds 8000; Render routes to $PORT.
      - key: PORT
        value: "8000"
      # production: API docs off; the synthetic chat policy is refused.
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Public project URL; tokens are verified against its JWKS (ES256).
      # Not a secret. No SUPABASE_JWT_SECRET: HS256 tokens are refused.
      - key: SUPABASE_URL
        value: https://xchigpviedftrkxldclk.supabase.co
      # SECRET. The least-privilege `app_backend` role's session-pooler URL, as
      # written by `python -m app.ops.backend_role --apply` (includes
      # sslmode=require). Never the `postgres` owner URL (OPEN_DECISIONS D-46).
      # Production also forces TLS if sslmode is missing.
      - key: DATABASE_URL
        sync: false
      # Chat stays off for real users.
      - key: CHAT_ENABLED
        value: "false"
