# Render Blueprint for the FastAPI backend (controlled testing).
#
# INERT until someone creates a Blueprint from it in the Render dashboard. It
# deploys nothing by itself. Secrets are `sync: false`: Render prompts for them
# at creation and they never live in this repository. Auto-deploy is off so
# every deploy is a deliberate action. Migrations are NOT run here: apply them
# with docs/SUPABASE_MIGRATION_RUNBOOK.md, under a separate approval.
services:
  - type: web
    name: ai-wellness-egypt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Paid instance: free instances sleep, and a cold start exceeds the
    # frontend's 5-second API timeout ("We can't load your account").
    plan: 0.5c-512mb
    # Choose the region closest to the Supabase project's region.
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # The image's uvicorn binds 8000; Render routes to $PORT.
      - key: PORT
        value: "8000"
      # production: API docs off; the synthetic chat policy is refused.
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # https://<project-ref>.supabase.co (tokens are verified against its JWKS)
      - key: SUPABASE_URL
        sync: false
      # Supabase *session pooler* connection string (IPv4). Secret.
      - key: DATABASE_URL
        sync: false
      # Chat stays off for real users.
      - key: CHAT_ENABLED
        value: "false"
